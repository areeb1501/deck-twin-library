# Every push, on any branch. Needs no secrets, GPU or network models: the `live` tests in
# modal/tests call the real endpoints and are run by hand (modal/README.md).
name: Test

on:
  push:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  twin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: alpha
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: alpha/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
