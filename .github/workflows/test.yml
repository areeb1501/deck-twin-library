# Every push, on any branch. Needs no secrets, GPU or network models: the `live` tests in
# modal/tests call the real endpoints and are run by hand (modal/README.md).
name: Test

on:
  push:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  twin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: alpha
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            alpha/package-lock.json
      # bridge/ imports ../registry, which needs the root packages
      - run: npm ci
        working-directory: .
      - run: npm ci
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npm test

  sam-service:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: modal
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv venv --python 3.12
      - run: uv pip install -r requirements-dev.txt
      - run: uv run --no-project pytest -m "not live"
