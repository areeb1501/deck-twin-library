#cloud-config
# user-data for the streaming stack's GCE VMs (Ubuntu 22.04/24.04 LTS images).
#
# GCE has no first-class "user data" field: the Ubuntu images ship cloud-init
# with the GCE datasource, which reads the instance metadata key `user-data`.
# deploy.sh therefore passes --metadata-from-file user-data=cloud-init.yaml.
# Debian/COS images will NOT run this — the image family choice is load-bearing.
#
# What this does NOT do: fetch or start the stack. deploy.sh copies streaming/
# up over scp and runs compose, so the VM image stays independent of the repo
# and re-deploying does not need a rebuild.

package_update: true
package_upgrade: false

# Docker's own apt repo, not Ubuntu's docker.io — the compose *plugin*
# (`docker compose`, not `docker-compose`) only ships from upstream.
apt:
  sources:
    docker:
      source: "deb [arch=amd64 signed-by=$KEY_FILE] https://download.docker.com/linux/ubuntu $RELEASE stable"
      keyid: 9DC858229FC7DD38854AE2D88D81803C0EBFCD88

packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
  - git
  - jq
  - curl

# Service account for the stack. Deploys arrive as the gcloud caller (the
# guest agent creates that account and grants it sudo), so this user exists to
# own the files and the docker socket, not to be logged into.
users:
  - default
  - name: plant
    gecos: streaming stack owner
    shell: /bin/bash
    groups: [docker]
    lock_passwd: true
    sudo: null

ssh_pwauth: false
disable_root: true

write_files:
  # Belt and braces: the GCE images already disable password auth, but the
  # sshd_config.d drop-in survives image changes and makes the posture explicit.
  - path: /etc/ssh/sshd_config.d/60-hardening.conf
    permissions: "0644"
    content: |
      PasswordAuthentication no
      PermitRootLogin no
      KbdInteractiveAuthentication no
      X11Forwarding no
      MaxAuthTries 3

  # ClickHouse opens tens of thousands of files and Kafka's page cache wants a
  # high map count; the distro defaults make both fail under trivial load with
  # errors that read like corruption rather than a limit.
  - path: /etc/sysctl.d/60-streaming.conf
    permissions: "0644"
    content: |
      fs.file-max = 1048576
      vm.max_map_count = 262144
      vm.swappiness = 10
      net.core.somaxconn = 4096

  - path: /etc/security/limits.d/60-streaming.conf
    permissions: "0644"
    content: |
      * soft nofile 262144
      * hard nofile 262144

  # Docker's default json-file logging is unbounded; a chatty simulator at a
  # few thousand events/second fills the boot disk in days and takes the whole
  # stack down with a write error, not an obvious "disk full".
  - path: /etc/docker/daemon.json
    permissions: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "50m", "max-file": "3" },
        "live-restore": true
      }

runcmd:
  - [sysctl, --system]
  - [systemctl, restart, ssh]
  - [systemctl, enable, --now, docker]
  - [systemctl, restart, docker]
  # setgid bit so files scp'd in by the deploying user stay group-writable by
  # docker — otherwise the second deploy fails on permissions, not the first.
  - [install, -d, -m, "2775", -o, plant, -g, docker, /opt/plant]
  # deploy.sh polls for this marker before it tries to scp. Without it the
  # copy races cloud-init and lands before docker exists.
  - [touch, /opt/plant/.cloud-init-done]

final_message: "streaming stack host ready after $UPTIME seconds"
