<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deck Twin: Alpha field digital twin</title>
    <style>
      /*
       * The full twin only, set by lite/boot.ts: the page's 90 % is its new 100 %. The UI layers scale, the 3D viewport does not:
       * R3F sizes the canvas from its own measurements, so a zoomed canvas falls short of the window. Labels shrink by font size because
       * their position is a JS transform. The minimap's click maths uses plain px, so it stays at 100 %.
       */
      html.twin-scale .app > :not(.viewport, .minimap), html.twin-scale .fgp-legend { zoom: 0.9; }
      html.twin-scale .label-layer .tag-chip { font-size: 10px; }

      /* Loader (src/ui/bootLoader.ts). Inline, so it paints before any script. The bar moves on transform only, so it runs on the compositor while the main thread builds the plant. */
      html { background: #0e0f13; }
      #boot-loader { position: fixed; inset: 0; z-index: 2000; display: grid; place-items: center; background: #0e0f13; color: #f5f5f7; font: 400 13px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; transition: opacity 420ms cubic-bezier(0.22, 1, 0.36, 1); }
      #boot-loader.bl-off { opacity: 0; pointer-events: none; }
      #boot-loader.bl-hidden { display: none; }
      .bl { display: grid; gap: 14px; width: min(260px, 70vw); }
      .bl-name { font-size: 17px; font-weight: 500; }
      .bl-pipe { position: relative; height: 2px; overflow: hidden; background: rgb(255 255 255 / 0.12); }
      .bl-pipe i { position: absolute; inset: 0 auto 0 0; width: 36%; background: #fe5510; will-change: transform; animation: bl-flow 1.6s cubic-bezier(0.65, 0, 0.35, 1) infinite; }
      .bl-stage { min-height: 2.9em; color: #9c9ca7; }
      .bl-failed .bl-pipe i { display: none; }
      @keyframes bl-flow { from { transform: translateX(-100%); } to { transform: translateX(278%); } }
      @media (prefers-reduced-motion: reduce) { .bl-pipe i { width: 100%; opacity: 0.5; animation: none; } }
    </style>
  </head>
  <body>
    <div id="boot-loader" role="status" aria-live="polite">
      <div class="bl">
        <div class="bl-name">Deck Twin</div>
        <div class="bl-pipe" aria-hidden="true"><i></i></div>
        <div class="bl-stage">Loading the plant</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/lite/boot.ts"></script>
  </body>
</html>
