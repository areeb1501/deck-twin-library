<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deck Twin: Alpha field digital twin</title>
    <style>
      /*
       * The full twin only, set by lite/boot.ts: the page's 90 % is its new 100 %. The UI layers scale, the 3D viewport does not:
       * R3F sizes the canvas from its own measurements, so a zoomed canvas falls short of the window. Labels shrink by font size because
       * their position is a JS transform. The minimap's click maths uses plain px, so it stays at 100 %.
       */
      html.twin-scale .app > :not(.viewport, .minimap), html.twin-scale .fgp-legend { zoom: 0.9; }
      html.twin-scale .label-layer .tag-chip { font-size: 10px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/lite/boot.ts"></script>
  </body>
</html>
